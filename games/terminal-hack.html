<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Hack - DEVOPS ARENA</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>
    <header class="game-header">
        <a class="back-link" href="../index.html">← Back to Arena</a>
        <h1>TERMINAL HACK</h1>
        <p>Click the hex codes in the target order before time runs out</p>
    </header>
    <main class="game-main">
        <section class="game-panel">
            <div class="hud">
                <span>Round: <b id="round">1</b></span>
                <span>Score: <b id="score">0</b></span>
                <span>Moves: <b id="moves">0</b></span>
                <span>Time: <b id="time">0</b>s</span>
            </div>
            <div class="target" id="target"></div>
            <div class="hex-grid" id="grid"></div>
            <div id="message"></div>
            <button id="next" class="play-btn" hidden>Next Round</button>
            <button id="restart" class="play-btn">Restart</button>
        </section>
    </main>
    <script src="../js/terminal-hack.js"></script>
</body>
</html>
