<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Racer - DEVOPS ARENA</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>
    <header class="game-header">
        <a class="back-link" href="../index.html">← Back to Arena</a>
        <h1>RETRO RACER</h1>
        <p>Left / Right arrows or A / D to change lanes</p>
    </header>
    <main class="game-main">
        <section class="game-panel">
            <div class="hud">
                <span>Score: <b id="score">0</b></span>
                <span>Coins: <b id="coins">0</b></span>
                <span>Speed: <b id="speed">4</b></span>
            </div>
            <canvas id="game" width="400" height="560"></canvas>
            <button id="restart" class="play-btn">Restart</button>
        </section>
    </main>
    <script src="../js/retro-racer.js"></script>
</body>
</html>
